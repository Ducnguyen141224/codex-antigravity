[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-agy-supervisor"
version = "0.1.0"
description = "Local Codex MCP to Antigravity ACP supervisor"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=1.0,<2",
    "aiohttp>=3.12,<4",
    "mcp>=1.30,<2",
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "pywin32>=310; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
codex-agy = "codex_agy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_agy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires the real authenticated Antigravity CLI"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
ignore = ["ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/test_integration.py" = ["ASYNC110"]
